name: report

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  UNRELEASED_VERSION: v0.1.0-alpha.1

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install unreleased
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: dhth/unreleased
          tag: ${{ env.UNRELEASED_VERSION }}
      - uses: actions/checkout@v6
      - name: Generate report
        env:
          UNRELEASED_GH_TOKEN: ${{ secrets.UNRELEASED_GH_TOKEN }}
        run: |
          unreleased report \
            --config-path unreleased.toml \
            --output-format html \
            --html-output dist/index.html \
            --html-template static/template.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
