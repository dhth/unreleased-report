name: report

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: github:dhth/unreleased
      - name: Generate report
        env:
          UNRELEASED_GH_TOKEN: ${{ secrets.UNRELEASED_GH_TOKEN }}
        run: mise run report
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
